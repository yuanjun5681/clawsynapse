natsServers:
  - nats://127.0.0.1:4222
localApiAddr: 127.0.0.1:18080
# All local API routes require the generated private bearer token file.
apiTokenPath: ""
allowRemoteAPI: false
apiTLSCertFile: ""
apiTLSKeyFile: ""
# Production requires tls:// or wss:// NATS URLs and credentials or mutual TLS.
production: false
natsCredentialsFile: ""
natsTLSCAFile: ""
natsTLSCertFile: ""
natsTLSKeyFile: ""
natsTLSServerName: ""
trustMode: tofu
trustAutoApprove: false
agentAdapter: default
# Named OpenClaw/OpenCode agents must be explicitly authorized here.
agentAllowedIds: []
agentAdapterTimeout: 10m
heartbeatInterval: 15s
announceTtl: 30s
agentProduct: clawsynapse
# Empty uses the clawsynapsed build version.
agentVersion: ""
# Human readable Bot name shown to peers (empty = unset).
displayName: ""
# Bot attributes advertised in discovery. Values are a string or a list of
# strings. "caps" is the reserved self-reported capability set.
labels:
  env: production
  role: worker
  caps:
    - chat
    - tools
# Legacy key: still loads and folds into labels.caps, but is rewritten to
# labels.caps on save.
# capabilities:
#   - chat
#   - tools
dataDir: ~/.clawsynapse
identityKeyPath: ~/.clawsynapse/identity.key
identityPubPath: ~/.clawsynapse/identity.pub
deliverablePrefixes:
  - chat
  - task
transferDir: ~/.clawsynapse/transfers
transferMaxFileSize: 104857600
transferTtl: 24h
logFilePath: ~/.clawsynapse/log/clawsynapsed.log
logRotateMaxSizeMb: 10
logRotateMaxBackups: 3
logRotateMaxAgeDays: 7
logRotateCompress: false
